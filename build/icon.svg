<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C85A32"/>
      <stop offset="30%" stop-color="#C85A32"/>
      <stop offset="32%" stop-color="#141413"/>
      <stop offset="50%" stop-color="#242220"/>
      <stop offset="52%" stop-color="#141413"/>
      <stop offset="70%" stop-color="#2A2724"/>
      <stop offset="72%" stop-color="#141413"/>
      <stop offset="98%" stop-color="#1A1816"/>
      <stop offset="100%" stop-color="#0D0C0B"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Turntable Base / Icon shape -->
  <rect width="512" height="512" rx="110" fill="#1E1B18"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#DCD6CB" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Vinyl Record Disc -->
  <circle cx="256" cy="256" r="210" fill="url(#vinyl)"/>
  <circle cx="256" cy="256" r="210" fill="url(#shine)"/>

  <!-- Grooves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Center Label -->
  <circle cx="256" cy="256" r="68" fill="#C85A32"/>
  <circle cx="256" cy="256" r="66" fill="none" stroke="#DCD6CB" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Spindle Hole -->
  <circle cx="256" cy="256" r="18" fill="#F6F4F0"/>
  <circle cx="256" cy="256" r="10" fill="#1E1B18"/>
</svg>
