<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spindle // Music Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono, Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alabaster: '#F6F4F0',
                        oatmeal: '#EBE7DF',
                        stone: '#DCD6CB',
                        espresso: '#1E1B18',
                        walnut: '#5C3A21',
                        terracotta: '#C85A32',
                        brass: '#D4AF37',
                        muted: '#78716C'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        cursive: ['"Caveat"', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #F6F4F0;
            color: #1E1B18;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            transition: background-color 0.35s ease, color 0.35s ease;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #DCD6CB;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C85A32;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #C85A32;
            margin-top: -5px;
            box-shadow: 0 2px 6px rgba(200, 90, 50, 0.4);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #a94622;
        }

        /* Subtle rotating animation for mini album art */
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-art {
            animation: slowSpin 14s linear infinite;
            animation-play-state: paused;
        }
        .spin-art.playing {
            animation-play-state: running;
        }

        /* Soundbar equalizer animation */
        @keyframes eqBar1 { 0%, 100% { height: 4px; } 50% { height: 14px; } }
        @keyframes eqBar2 { 0%, 100% { height: 14px; } 40% { height: 5px; } 80% { height: 12px; } }
        @keyframes eqBar3 { 0%, 100% { height: 6px; } 30% { height: 15px; } 70% { height: 4px; } }
        .eq-bar-1 { animation: eqBar1 0.8s ease-in-out infinite; }
        .eq-bar-2 { animation: eqBar2 0.7s ease-in-out infinite; }
        .eq-bar-3 { animation: eqBar3 0.9s ease-in-out infinite; }

        .drag-over-top {
            border-top: 2px solid #C85A32 !important;
        }
        .drag-over-bottom {
            border-bottom: 2px solid #C85A32 !important;
        }

        /* Warm, Low-Contrast Dark Theme Overrides (Easy on the eyes) */
        body.dark-theme {
            background-color: #211E1B;
            color: #DDD7CE;
        }
        body.dark-theme .bg-alabaster {
            background-color: #23201D !important;
        }
        body.dark-theme .bg-alabaster\/85,
        body.dark-theme .bg-alabaster\/75,
        body.dark-theme .bg-alabaster\/60,
        body.dark-theme .bg-alabaster\/90 {
            background-color: rgba(38, 34, 30, 0.88) !important;
        }
        body.dark-theme .bg-oatmeal,
        body.dark-theme .bg-oatmeal\/70,
        body.dark-theme .bg-oatmeal\/60,
        body.dark-theme .bg-oatmeal\/50,
        body.dark-theme .bg-oatmeal\/40 {
            background-color: #2B2723 !important;
        }
        body.dark-theme .text-espresso {
            color: #DDD7CE !important;
        }
        body.dark-theme .text-muted {
            color: #9A9288 !important;
        }
        body.dark-theme .border-stone,
        body.dark-theme .border-stone\/80,
        body.dark-theme .border-stone\/70,
        body.dark-theme .border-stone\/60,
        body.dark-theme .border-stone\/50,
        body.dark-theme .border-stone\/40 {
            border-color: #38332E !important;
        }
        body.dark-theme .bg-stone,
        body.dark-theme .bg-stone\/60 {
            background-color: #3A342F !important;
        }
        body.dark-theme .hover\:bg-oatmeal:hover {
            background-color: #342F2A !important;
        }
        body.dark-theme .hover\:bg-alabaster\/60:hover {
            background-color: rgba(48, 43, 38, 0.75) !important;
        }
        body.dark-theme #spindle-logo-text {
            fill: #DDD7CE;
        }
        body.dark-theme #viewport-main {
            background: radial-gradient(circle at center, #2E2925 0%, #231F1C 62%, #1B1815 100%) !important;
        }
        body.dark-theme #vol-fill {
            background-color: #C8C0B6 !important;
        }
        body.dark-theme ::-webkit-scrollbar-thumb {
            background: #423B35;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col lg:flex-row overflow-hidden">

    <!-- LEFT PANEL: SIDEBAR MENU & PLAYER -->
    <aside class="w-full lg:w-[460px] xl:w-[510px] h-[58%] lg:h-full bg-alabaster border-b lg:border-b-0 lg:border-r border-stone/70 flex flex-col justify-between z-20 shadow-xl lg:shadow-none transition-colors duration-300">
        
        <!-- Top Header with Spindle Cursive Logo -->
        <header class="px-6 pt-3.5 pb-2.5 flex items-center justify-between border-b border-stone/50 shrink-0">
            <div class="flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 48" class="h-9 w-auto -ml-1">
                    <text id="spindle-logo-text" x="4" y="36" font-family="'Caveat', cursive" font-weight="600" font-size="42" fill="#1E1B18" class="transition-colors duration-300">Spindle</text>
                    <circle cx="57" cy="12" r="2.5" fill="#C85A32"/>
                </svg>
            </div>
            <div class="flex items-center gap-2.5">
                <div class="w-2.5 h-2.5 rounded-full bg-stone shadow-sm" id="status-led"></div>
                <span id="state-badge" class="font-mono text-[11px] px-2.5 py-0.5 rounded-full bg-oatmeal text-muted border border-stone uppercase tracking-wider">
                    Stopped
                </span>
            </div>
        </header>

        <!-- TOP OF MENU: CURRENTLY OPENED PLAYLIST HERO (Centered, bigger artwork, details below) -->
        <section id="opened-playlist-hero" class="hidden px-6 pt-4 pb-4 border-b border-stone/60 bg-alabaster flex-col items-center text-center shrink-0 relative transition-colors duration-300">
            <!-- Back to Playlists Button (Top-Left of Hero) -->
            <button id="btn-back-playlists" class="absolute left-5 top-4 inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-medium text-muted hover:text-espresso hover:bg-oatmeal transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
                <span>Playlists</span>
            </button>

            <!-- Playlist 3-Dot Options Button (Top-Right of Hero) -->
            <button id="btn-hero-playlist-menu" class="absolute right-5 top-4 p-2 rounded-xl text-muted hover:text-espresso hover:bg-oatmeal transition" title="Playlist Options">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
                </svg>
            </button>

            <!-- Centered Larger Playlist Artwork -->
            <div id="hero-playlist-artwork" title="Click to Change Artwork" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl bg-espresso shadow-md flex items-center justify-center overflow-hidden border border-stone cursor-pointer group relative mt-1">
                <!-- Populated dynamically via JS -->
            </div>

            <!-- Playlist Title & Metadata Below Artwork -->
            <h1 id="hero-playlist-title" class="font-serif text-2xl sm:text-3xl font-semibold text-espresso truncate max-w-full leading-tight mt-3">
                Playlist Title
            </h1>
            <p id="hero-playlist-meta" class="font-mono text-[11px] text-muted mt-0.5">
                0 songs • 00:00
            </p>

            <!-- Playlist Action Controls Below Metadata -->
            <div class="flex items-center justify-center gap-2 mt-3">
                <button id="btn-hero-play" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-xl bg-terracotta text-alabaster hover:bg-[#b04b25] text-xs font-medium transition shadow-sm active:scale-95">
                    <svg class="w-3.5 h-3.5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span>Play</span>
                </button>

                <button id="btn-hero-add-songs" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border border-stone bg-oatmeal/70 hover:bg-oatmeal text-espresso text-xs font-medium transition active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Add Songs</span>
                </button>

                <button id="btn-toggle-reorder" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-stone bg-alabaster hover:bg-oatmeal text-espresso text-xs font-medium transition active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                    </svg>
                    <span id="reorder-btn-label">Reorder</span>
                </button>
            </div>
        </section>

        <!-- MIDDLE SECTION: PLAYLISTS OVERVIEW OR SONGS LIST -->
        <section class="flex-1 flex flex-col min-h-0 bg-oatmeal/40 transition-colors duration-300">
            <!-- Section Subheader (Visible in Playlists Overview mode) -->
            <div id="playlists-overview-header" class="px-6 py-3 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                    <h2 class="font-mono text-xs uppercase tracking-wider text-muted font-medium truncate">
                        Playlists
                    </h2>
                    <span id="playlist-count" class="font-mono text-[11px] px-2 py-0.5 rounded-full bg-stone/60 text-espresso shrink-0">2</span>
                </div>
                
                <button id="btn-create-playlist" class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-terracotta text-alabaster hover:bg-[#b04b25] text-xs font-medium transition shadow-sm active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Create Playlist</span>
                </button>
            </div>

            <!-- List Container -->
            <div id="playlist-container" class="flex-1 overflow-y-auto px-4 py-2.5 space-y-1.5 relative">
                <!-- Populated dynamically via JS -->
            </div>
        </section>

        <!-- BOTTOM SECTION: CURRENTLY PLAYING DECK (Hidden initially until a song/playlist is started) -->
        <section id="now-playing-section" class="hidden px-6 py-3.5 bg-alabaster border-t border-stone/80 flex-col gap-3 shrink-0 shadow-[0_-4px_20px_rgba(30,27,24,0.06)] transition-colors duration-300">
            <div class="flex items-center gap-4">
                <!-- Mini Spinning Disc Cover -->
                <div class="relative w-14 h-14 rounded-2xl bg-espresso shadow-md flex items-center justify-center overflow-hidden shrink-0 border border-stone">
                    <div id="cover-disc" class="w-11 h-11 rounded-full border-2 border-neutral-800 flex items-center justify-center spin-art" style="background: radial-gradient(circle, #C85A32 0%, #C85A32 28%, #141413 30%, #222 45%, #111 47%, #292929 65%, #111 70%, #1c1c1c 100%);">
                        <div class="w-2 h-2 rounded-full bg-alabaster"></div>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-tr from-black/30 via-transparent to-white/10 pointer-events-none"></div>
                </div>

                <!-- Track Metadata -->
                <div class="flex flex-col min-w-0 flex-1">
                    <div class="flex items-center gap-2">
                        <span id="NowPlaying-playlist-name" class="font-mono text-[10px] uppercase tracking-wider text-terracotta font-semibold truncate">Playlist</span>
                    </div>
                    <h2 id="current-title" class="font-serif text-xl sm:text-2xl font-semibold text-espresso truncate leading-tight">
                        Velvet Espresso
                    </h2>
                    <p id="current-artist" class="text-xs text-muted truncate font-normal">
                        Aura Analog Ensemble
                    </p>
                </div>
            </div>

            <!-- Progress & Scrubber -->
            <div class="flex flex-col gap-1">
                <div class="relative w-full flex items-center">
                    <input 
                        id="seek-slider" 
                        type="range" 
                        min="0" 
                        max="1000" 
                        value="0" 
                        class="w-full z-10"
                        aria-label="Seek time"
                    >
                    <div class="w-full h-1 bg-stone rounded-full absolute left-0 pointer-events-none overflow-hidden">
                        <div id="seek-fill" class="h-full bg-terracotta transition-all duration-75" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="flex justify-between font-mono text-[10px] text-muted">
                    <span id="time-current">00:00</span>
                    <span id="time-total">02:15</span>
                </div>
            </div>

            <!-- Playback Controls & Volume -->
            <div class="flex items-center justify-between gap-2">
                <!-- Transport Buttons -->
                <div class="flex items-center gap-1 sm:gap-1.5">
                    <!-- Previous -->
                    <button id="btn-prev" title="Previous" class="p-2 rounded-xl text-espresso hover:bg-oatmeal active:scale-95 transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>

                    <!-- Play / Pause -->
                    <button id="btn-play" title="Play / Pause" class="w-10 h-10 rounded-2xl bg-terracotta text-alabaster hover:bg-[#b04b25] active:scale-95 transition-all flex items-center justify-center shadow-md">
                        <svg id="icon-play" class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="icon-pause" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>

                    <!-- Stop -->
                    <button id="btn-stop" title="Stop" class="p-2 rounded-xl text-espresso hover:bg-oatmeal active:scale-95 transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 6h12v12H6z"/>
                        </svg>
                    </button>

                    <!-- Next -->
                    <button id="btn-next" title="Next" class="p-2 rounded-xl text-espresso hover:bg-oatmeal active:scale-95 transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>

                    <!-- Shuffle -->
                    <button id="btn-shuffle" title="Shuffle" class="p-1.5 rounded-xl text-muted hover:text-espresso hover:bg-oatmeal active:scale-95 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
                        </svg>
                    </button>

                    <!-- Repeat -->
                    <button id="btn-repeat" title="Repeat" class="p-1.5 rounded-xl text-muted hover:text-espresso hover:bg-oatmeal active:scale-95 transition relative">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/>
                        </svg>
                        <span id="repeat-one-badge" class="hidden absolute top-0 right-0 text-[8px] font-mono bg-terracotta text-alabaster w-3 h-3 rounded-full flex items-center justify-center">1</span>
                    </button>
                </div>

                <!-- Volume & Crackle Toggle -->
                <div class="flex items-center gap-2.5">
                    <button id="btn-crackle" title="Toggle Surface Crackle" class="px-2 py-1 rounded-lg border border-stone bg-oatmeal/70 hover:bg-oatmeal text-[10px] font-mono text-espresso flex items-center gap-1.5 transition">
                        <span id="crackle-dot" class="w-2 h-2 rounded-full bg-terracotta"></span>
                        <span>CRACKLE</span>
                    </button>

                    <div class="hidden sm:flex items-center gap-1.5 w-20">
                        <button id="btn-mute" class="text-muted hover:text-espresso transition" title="Mute/Unmute">
                            <svg id="icon-vol" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                            </svg>
                        </button>
                        <div class="relative flex-1 flex items-center">
                            <input id="vol-slider" type="range" min="0" max="1" step="0.01" value="0.8" class="w-full z-10" aria-label="Volume">
                            <div class="w-full h-1 bg-stone rounded-full absolute left-0 pointer-events-none overflow-hidden">
                                <div id="vol-fill" class="h-full bg-espresso" style="width: 80%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </aside>

    <!-- RIGHT PANEL: INTERACTIVE 3D RECORD PLAYER -->
    <main id="viewport-main" class="flex-1 h-[42%] lg:h-full relative bg-gradient-to-br from-[#EFECE6] via-[#E5DFD5] to-[#D6CFC2] overflow-hidden transition-colors duration-500">
        <!-- Three.js Canvas Mount -->
        <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

        <!-- Floating Top HUD Controls -->
        <div class="absolute top-4 left-4 right-4 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
            
            <!-- Top-Left: Compact Left-to-Right Light / Dark Theme Toggle Switch -->
            <button id="btn-theme-toggle" type="button" aria-label="Toggle Light/Dark Theme" class="pointer-events-auto relative w-16 h-8 rounded-full bg-alabaster/85 backdrop-blur-md border border-stone/80 p-1 flex items-center justify-between shadow-sm cursor-pointer transition-colors duration-300">
                <!-- Sliding Pill Thumb -->
                <div id="theme-toggle-thumb" class="w-6 h-6 rounded-full bg-terracotta shadow-xs transition-transform duration-300 ease-out translate-x-0"></div>
                <!-- Centered Sun / Moon Icons -->
                <div class="absolute inset-1 flex items-center justify-between pointer-events-none">
                    <span id="theme-label-light" class="w-6 h-6 flex items-center justify-center text-alabaster transition-colors duration-300">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"/>
                            <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
                        </svg>
                    </span>
                    <span id="theme-label-dark" class="w-6 h-6 flex items-center justify-center text-muted transition-colors duration-300">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                        </svg>
                    </span>
                </div>
            </button>

            <!-- Top-Right: Manual Camera Preset Angles & Dust Cover Toggle -->
            <div class="pointer-events-auto flex items-center gap-1.5 bg-alabaster/85 backdrop-blur-md border border-stone/80 p-1.5 rounded-2xl shadow-sm transition-colors duration-300">
                <button data-cam="iso" class="cam-btn px-2.5 py-1 rounded-xl font-mono text-[11px] bg-terracotta text-alabaster transition">ISO</button>
                <button data-cam="top" class="cam-btn px-2.5 py-1 rounded-xl font-mono text-[11px] text-espresso hover:bg-oatmeal transition">TOP</button>
                <button data-cam="side" class="cam-btn px-2.5 py-1 rounded-xl font-mono text-[11px] text-espresso hover:bg-oatmeal transition">SIDE</button>
                <div class="h-4 w-[1px] bg-stone mx-0.5"></div>
                <button id="btn-cover-toggle" class="px-2.5 py-1 rounded-xl font-mono text-[11px] text-espresso hover:bg-oatmeal transition" title="Open / Close Acrylic Dust Cover">COVER</button>
            </div>
        </div>

        <!-- Bottom Hint Overlay -->
        <div class="absolute bottom-4 right-4 pointer-events-none hidden sm:flex items-center gap-2 bg-alabaster/75 backdrop-blur-sm px-3 py-1.5 rounded-full border border-stone/60 text-[11px] font-mono text-muted">
            <span>ORBIT: LEFT DRAG</span>
            <span>•</span>
            <span>ZOOM: SCROLL</span>
        </div>

        <!-- Drag & Drop Overlay -->
        <div id="drop-overlay" class="fixed inset-0 bg-espresso/70 backdrop-blur-sm z-50 hidden items-center justify-center p-6">
            <div class="border-2 border-dashed border-alabaster rounded-3xl p-12 text-center max-w-md">
                <p class="font-serif text-3xl text-alabaster mb-2">Drop Audio Files</p>

        /***********************************************************************
         * 2. INDEXEDDB STORAGE FOR PERSISTENT PLAYLISTS & LOCAL AUDIO FILES
         ***********************************************************************/
        class LocalLibraryDB {
            constructor() {
                this.dbName = 'SpindleMusicPlayerDB';
                this.dbVersion = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve) => {
                    const req = indexedDB.open(this.dbName, this.dbVersion);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('audioFiles')) {
                            db.createObjectStore('audioFiles', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('appState')) {
                            db.createObjectStore('appState', { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                    req.onerror = () => resolve();
                });
            }

            async saveAudioBlob(id, blob) {
                if (!this.db) return;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('audioFiles', 'readwrite');
                    tx.objectStore('audioFiles').put({ id, blob });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                });
            }

            async getAudioBlob(id) {
                if (!this.db) return null;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('audioFiles', 'readonly');
                    const req = tx.objectStore('audioFiles').get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                    req.onerror = () => resolve(null);
                });
            }

            async saveMetadata(tracksMeta, playlists) {
                if (!this.db) return;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('appState', 'readwrite');
                    const store = tx.objectStore('appState');
                    const serializableTracks = {};
                    Object.values(tracksMeta).forEach(t => {
                        const copy = { ...t };
                        delete copy.url;
                        serializableTracks[t.id] = copy;
                    });
                    store.put({ key: 'library', tracks: serializableTracks, playlists });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                });
            }

            async loadMetadata() {
                if (!this.db) return null;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('appState', 'readonly');
                    const req = tx.objectStore('appState').get('library');
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            }
        }

        const storageDB = new LocalLibraryDB();

        /***********************************************************************

        function getPlayingPlaylist() {
            if (!AppState.playingPlaylistId) return null;

        }

        function getViewedPlaylist() {

        }

        function getCurrentTrack() {
            const pl = getPlayingPlaylist();
            if (!pl || !pl.trackIds.length) return null;
            const tid = pl.trackIds[AppState.currentIndex] || pl.trackIds[0];
            return AppState.tracksById[tid] || null;
        }

        async function persistState() {
            await storageDB.saveMetadata(AppState.tracksById, AppState.playlists);
        }

        // Lightweight ID3v2 Title/Artist parser for local files
        async function parseAudioTitleArtist(file) {
            const rawName = file.name.replace(/\.[^/.]+$/, '');
            let artist = 'Unknown Artist';
            let title = rawName;
            if (rawName.includes(' - ')) {
                const parts = rawName.split(' - ');
                artist = parts[0].trim();
                title = parts.slice(1).join(' - ').trim();
            }

            try {
                const buffer = await file.slice(0, 65536).arrayBuffer();
                const view = new DataView(buffer);
                if (view.byteLength > 10 && view.getUint8(0) === 0x49 && view.getUint8(1) === 0x44 && view.getUint8(2) === 0x33) {
                    const version = view.getUint8(3);
                    const tagSize = ((view.getUint8(6) & 0x7f) << 21) |
                                    ((view.getUint8(7) & 0x7f) << 14) |
                                    ((view.getUint8(8) & 0x7f) << 7) |
                                    (view.getUint8(9) & 0x7f);
                    const limit = Math.min(view.byteLength, tagSize + 10);
                    let offset = 10;

                    while (offset + 10 < limit) {
                        const frameID = String.fromCharCode(
                            view.getUint8(offset),
                            view.getUint8(offset + 1),
                            view.getUint8(offset + 2),
                            view.getUint8(offset + 3)
                        );
                        if (!/^[A-Z0-9]{4}$/.test(frameID)) break;

                        let frameSize = version === 4
                            ? ((view.getUint8(offset + 4) & 0x7f) << 21) |
                              ((view.getUint8(offset + 5) & 0x7f) << 14) |
                              ((view.getUint8(offset + 6) & 0x7f) << 7) |
                              (view.getUint8(offset + 7) & 0x7f)
                            : view.getUint32(offset + 4);

                        if (frameSize <= 0 || offset + 10 + frameSize > limit) break;

                        if (frameID === 'TIT2' || frameID === 'TPE1') {
                            const encoding = view.getUint8(offset + 10);
                            const bytes = new Uint8Array(buffer, offset + 11, frameSize - 1);
                            let text = '';
                            if (encoding === 0 || encoding === 3) {
                                text = new TextDecoder('utf-8').decode(bytes);
                            } else if (encoding === 1 || encoding === 2) {
                                text = new TextDecoder('utf-16').decode(bytes);
                            }
                            text = text.replace(/\0/g, '').trim();
                            if (text) {
                                if (frameID === 'TIT2') title = text;
                                if (frameID === 'TPE1') artist = text;
                            }
                        }
                        offset += 10 + frameSize;
                    }
                }
            } catch (e) {}

            return { title, artist };
        }

        /***********************************************************************
         * 4. WEB AUDIO ENGINE & LOCAL AUDIO MANAGER
         ***********************************************************************/
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.crackleGain = null;
                this.synthInterval = null;
                this.stepCounter = 0;
                this.htmlAudio = document.getElementById('html5-audio');

                this.htmlAudio.addEventListener('timeupdate', () => {
                    const track = getCurrentTrack();
                    if (track && !track.isSynth && !AppState.isSeeking) {
                        AppState.currentTime = this.htmlAudio.currentTime;
                        if (this.htmlAudio.duration && !isNaN(this.htmlAudio.duration)) {
                            AppState.duration = this.htmlAudio.duration;
                        }
                        updatePlayerUI();
                    }
                });

                this.htmlAudio.addEventListener('loadedmetadata', () => {
                    const track = getCurrentTrack();
                    if (track && !track.isSynth && this.htmlAudio.duration && !isNaN(this.htmlAudio.duration)) {
                        track.duration = this.htmlAudio.duration;
                        AppState.duration = this.htmlAudio.duration;
                        renderSidebarView();
                        updatePlayerUI();
                    }
                });

                this.htmlAudio.addEventListener('ended', () => {
                    handleTrackEnded();
                });
            }

            initContext() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = AppState.isMuted ? 0 : AppState.volume;
                    this.masterGain.connect(this.ctx.destination);
                    this.setupVinylCrackle();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            setupVinylCrackle() {
                const bufferSize = 2 * this.ctx.sampleRate;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    let sample = (Math.random() * 2 - 1) * 0.012;
                    if (Math.random() < 0.0012) {
                        sample += (Math.random() * 2 - 1) * 0.35;
                    }
                    output[i] = sample;
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1900;
                filter.Q.value = 0.9;

                this.crackleGain = this.ctx.createGain();
                this.crackleGain.gain.value = 0;

                whiteNoise.connect(filter);
                filter.connect(this.crackleGain);
                this.crackleGain.connect(this.masterGain);
                whiteNoise.start(0);
            }

            updateCrackleLevel() {
                if (!this.crackleGain || !this.ctx) return;
                const shouldCrackle = AppState.playbackState === 'PLAYING' && AppState.crackleEnabled;
                this.crackleGain.gain.setTargetAtTime(shouldCrackle ? 0.25 : 0, this.ctx.currentTime, 0.15);
            }

            setVolume(val) {
                AppState.volume = val;
                this.htmlAudio.volume = AppState.isMuted ? 0 : val;
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setTargetAtTime(AppState.isMuted ? 0 : val, this.ctx.currentTime, 0.05);
                }
            }

            playTrack(track, startTime = 0) {
                if (!track) return;
                this.initContext();
                this.stopAllAudioOnly();

                if (track.isSynth) {
                    this.htmlAudio.pause();
                    AppState.currentTime = startTime;
                    AppState.duration = track.duration;
                    this.startSynthSequencer(track.synthPreset);
                } else {
                    if (this.htmlAudio.src !== track.url) {
                        this.htmlAudio.src = track.url;
                    }
                    this.htmlAudio.currentTime = startTime;
                    this.htmlAudio.volume = AppState.isMuted ? 0 : AppState.volume;
                    this.htmlAudio.play().catch(() => {});
                }
                this.updateCrackleLevel();
            }

            pauseAudio() {
                const track = getCurrentTrack();
                if (!track) return;
                if (track.isSynth) {
                    this.stopSynthSequencer();
                } else {
                    this.htmlAudio.pause();
                }
                this.updateCrackleLevel();
            }

            stopAllAudioOnly() {
                this.stopSynthSequencer();
                this.htmlAudio.pause();
                this.updateCrackleLevel();
            }

            seek(seconds) {
                const track = getCurrentTrack();
                if (!track) return;
                AppState.currentTime = seconds;
                if (!track.isSynth) {
                    this.htmlAudio.currentTime = seconds;
                }
            }

            startSynthSequencer(preset) {
                this.stopSynthSequencer();
                const stepMs = 450;

                const triggerStep = () => {
                    if (AppState.playbackState !== 'PLAYING') return;
                    this.playSynthStep(preset, this.stepCounter);
                    this.stepCounter++;
                };

                triggerStep();
                this.synthInterval = setInterval(triggerStep, stepMs);
            }

            stopSynthSequencer() {
                if (this.synthInterval) {
                    clearInterval(this.synthInterval);
                    this.synthInterval = null;
                }
            }

            playSynthStep(preset, step) {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                const chords = {
                    lofi_jazz: [
                        [261.63, 329.63, 392.00, 493.88],
                        [220.00, 261.63, 329.63, 392.00],
                        [293.66, 349.23, 440.00, 523.25],
                        [196.00, 246.94, 293.66, 349.23]
                    ],
                    ambient_waltz: [
                        [293.66, 369.99, 440.00, 554.37],
                        [246.94, 329.63, 392.00, 493.88],
                        [329.63, 392.00, 493.88, 587.33],
                        [220.00, 277.18, 329.63, 392.00]
                    ],
                    zen_pluck: [
                        [261.63, 293.66, 329.63, 392.00, 440.00, 523.25],
                        [196.00, 220.00, 261.63, 293.66, 329.63, 392.00]
                    ],
                    warm_synth: [
                        [174.61, 220.00, 261.63, 329.63],
                        [164.81, 196.00, 246.94, 293.66],
                        [146.83, 174.61, 220.00, 261.63],
                        [130.81, 164.81, 196.00, 246.94]
                    ]
                };

                const set = chords[preset] || chords.lofi_jazz;
                const chordIdx = Math.floor(step / 8) % set.length;
                const currentChord = set[chordIdx];

                if (step % 8 === 0) {
                    currentChord.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = preset === 'warm_synth' ? 'sawtooth' : 'sine';
                        osc.frequency.value = freq;

                        const lp = this.ctx.createBiquadFilter();
                        lp.type = 'lowpass';
                        lp.frequency.value = 950;

                        gain.gain.setValueAtTime(0.001, now);
                        gain.gain.linearRampToValueAtTime(0.055 / (idx * 0.35 + 1), now + 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.0008, now + 3.2);

                        osc.connect(lp);
                        lp.connect(gain);
                        gain.connect(this.masterGain);

                        osc.start(now);
                        osc.stop(now + 3.3);
                    });
                }

                if (step % 2 === 0 || Math.random() > 0.45) {
                    const noteFreq = currentChord[step % currentChord.length] * (step % 4 === 0 ? 2 : 1);
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.value = noteFreq;

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.04, now + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.9);

                    osc.connect(gain);
                    gain.connect(this.masterGain);

                    osc.start(now);
                    osc.stop(now + 0.95);
                }

                if (step % 4 === 0) {
                    const bassOsc = this.ctx.createOscillator();
                    const bassGain = this.ctx.createGain();
                    bassOsc.type = 'sine';
                    bassOsc.frequency.value = currentChord[0] / 2;

                    bassGain.gain.setValueAtTime(0.001, now);
                    bassGain.gain.linearRampToValueAtTime(0.09, now + 0.04);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                    bassOsc.connect(bassGain);
                    bassGain.connect(this.masterGain);

                    bassOsc.start(now);
                    bassOsc.stop(now + 0.75);
                }
            }
        }

        const audioEngine = new SoundEngine();

        /***********************************************************************
         * 5. HIGH-DETAIL THREE.JS 3D RECORD PLAYER
         ***********************************************************************/
        class Turntable3D {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.scene = new THREE.Scene();

                this.camera = new THREE.PerspectiveCamera(
                    35,
                    this.container.clientWidth / this.container.clientHeight,
                    0.1,
                    100
                );
                // Startup in ISO view
                this.camera.position.set(5.9, 5.1, 6.7);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.02;
                this.container.appendChild(this.renderer.domElement);

                // Dark-ceiling studio environment map so horizontal vinyl stays deep black while vertical chrome shines
                this.scene.environment = this.createStudioEnvMap();

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.06;
                this.controls.target.set(0, 0.2, 0);
                this.controls.maxPolarAngle = Math.PI / 2 - 0.04;
                this.controls.minDistance = 3.8;
                this.controls.maxDistance = 14;

                // Cancel automated camera transition if user manually grabs the orbit canvas
                this.renderer.domElement.addEventListener('pointerdown', () => {
                    this.camAnim = null;
                });

                this.clock = new THREE.Clock();
                this.currentRPM = 0;
                this.targetRPM = 0;

                this.mechState = 'IDLE_STOPPED';
                this.recordHeight = 0.0;
                this.armYaw = 0.0;
                this.armPitch = 0.0;
                this.powerSwitchAngle = -0.35;
                this.dustCoverOpen = true;
                this.dustCoverAngle = 1.02;

                // Spherical smooth camera transition state
                this.camAnim = null;

                this.initLights();
                this.buildTurntable();
                this.bindResize();
            }

            createStudioEnvMap() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                const bg = ctx.createLinearGradient(0, 0, 0, 256);
                bg.addColorStop(0, '#0D0C0B');
                bg.addColorStop(0.38, '#1A1816');
                bg.addColorStop(0.50, '#C8C0B4');
                bg.addColorStop(0.62, '#2A2622');
                bg.addColorStop(1, '#0F0E0D');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, 512, 256);

                ctx.fillStyle = '#FFF9F0';
                ctx.fillRect(40, 114, 140, 26);
                ctx.fillStyle = '#FFE4C4';
                ctx.fillRect(320, 116, 130, 24);

                const tex = new THREE.CanvasTexture(canvas);
                tex.mapping = THREE.EquirectangularReflectionMapping;
                return tex;
            }

            initLights() {
                this.ambientLight = new THREE.AmbientLight(0xFFF8EE, 0.50);
                this.scene.add(this.ambientLight);

                this.dirLight = new THREE.DirectionalLight(0xFFF5E4, 1.18);
                this.dirLight.position.set(-4.2, 9.2, 5.8);
                this.dirLight.castShadow = true;
                this.dirLight.shadow.mapSize.width = 2048;
                this.dirLight.shadow.mapSize.height = 2048;
                this.dirLight.shadow.camera.near = 1;
                this.dirLight.shadow.camera.far = 25;
                const d = 5;
                this.dirLight.shadow.camera.left = -d;
                this.dirLight.shadow.camera.right = d;
                this.dirLight.shadow.camera.top = d;
                this.dirLight.shadow.camera.bottom = -d;
                this.dirLight.shadow.bias = -0.0005;
                this.scene.add(this.dirLight);

                this.rimLight = new THREE.DirectionalLight(0xDCE6F2, 0.52);
                this.rimLight.position.set(6.5, 3.0, -5.2);
                this.scene.add(this.rimLight);

                this.strobeLight = new THREE.PointLight(0xFF5A1F, 0.9, 1.9);
                this.strobeLight.position.set(-1.82, 0.55, 1.38);
                this.scene.add(this.strobeLight);

                this.targetLight = new THREE.PointLight(0xFFCC77, 0.0, 1.8);
                this.targetLight.position.set(0.75, 0.58, 1.22);
                this.scene.add(this.targetLight);
            }

            setTheme(isDark) {
                if (isDark) {
                    this.ambientLight.intensity = 0.42;
                    this.dirLight.intensity = 1.02;
                    this.renderer.toneMappingExposure = 0.96;
                } else {
                    this.ambientLight.intensity = 0.50;
                    this.dirLight.intensity = 1.18;
                    this.renderer.toneMappingExposure = 1.02;
                }
            }

            createWalnutTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                const baseGrad = ctx.createLinearGradient(0, 0, 1024, 1024);
                baseGrad.addColorStop(0, '#4E2E18');
                baseGrad.addColorStop(0.5, '#3E2210');
                baseGrad.addColorStop(1, '#4A2A15');
                ctx.fillStyle = baseGrad;
                ctx.fillRect(0, 0, 1024, 1024);

                for (let i = 0; i < 900; i++) {
                    ctx.fillStyle = i % 3 === 0
                        ? 'rgba(22, 10, 4, 0.18)'
                        : i % 2 === 0
                            ? 'rgba(110, 68, 36, 0.11)'
                            : 'rgba(55, 30, 14, 0.14)';
                    const y = Math.random() * 1024;
                    const h = 1 + Math.random() * 4;
                    ctx.fillRect(0, y, 1024, h);
                }

                ctx.fillStyle = 'rgba(18, 8, 3, 0.25)';
                for (let i = 0; i < 1600; i++) {
                    ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 8 + Math.random() * 24, 1);
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.anisotropy = 4;
                return tex;
            }

            createBrushedMetalTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#D8D4CD';
                ctx.fillRect(0, 0, 512, 512);

                for (let i = 0; i < 1400; i++) {
                    const shade = 200 + Math.floor(Math.random() * 35);
                    ctx.fillStyle = `rgba(${shade}, ${shade - 2}, ${shade - 5}, 0.18)`;
                    ctx.fillRect(0, Math.random() * 512, 512, 1);
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            createPitchScaleTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#23201D';
                ctx.fillRect(0, 0, 128, 512);

                ctx.strokeStyle = '#BDB6AC';
                ctx.fillStyle = '#DCD6CB';
                ctx.font = 'bold 18px "JetBrains Mono", monospace';
                ctx.textAlign = 'right';

                const labels = ['-8', '-6', '-4', '-2', '0', '+2', '+4', '+6', '+8'];
                for (let i = 0; i <= 32; i++) {
                    const y = 36 + (i / 32) * 440;
                    const isMajor = i % 4 === 0;
                    ctx.lineWidth = isMajor ? 3 : 1.5;
                    ctx.beginPath();
                    ctx.moveTo(isMajor ? 42 : 54, y);
                    ctx.lineTo(70, y);
                    ctx.stroke();

                    if (isMajor) {
                        const lbl = labels[i / 4];
                        ctx.fillStyle = lbl === '0' ? '#C85A32' : '#DCD6CB';
                        ctx.fillText(lbl, 36, y + 6);
                    }
                }

                return new THREE.CanvasTexture(canvas);
            }

            // Deep Jet-Black Procedural Vinyl Grooves + Dynamic Song/Artist Label
            createVinylTexture(track) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                const cx = 512, cy = 512;

                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, 1024, 1024);

                const grad1 = ctx.createConicGradient(0.4, cx, cy);
                grad1.addColorStop(0, 'rgba(255,255,255,0)');
                grad1.addColorStop(0.12, 'rgba(255,255,255,0.045)');
                grad1.addColorStop(0.25, 'rgba(255,255,255,0)');
                grad1.addColorStop(0.5, 'rgba(255,255,255,0)');
                grad1.addColorStop(0.62, 'rgba(255,255,255,0.045)');
                grad1.addColorStop(0.75, 'rgba(255,255,255,0)');
                grad1.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad1;
                ctx.fillRect(0, 0, 1024, 1024);

                for (let r = 175; r < 495; r += 2.0) {
                    const isTrackGap = (r > 265 && r < 270) || (r > 350 && r < 355) || (r > 430 && r < 434);
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = isTrackGap
                        ? '#020202'
                        : (Math.random() > 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.85)');
                    ctx.lineWidth = 1.05;
                    ctx.stroke();
                }

                const labelRadius = 165;
                ctx.beginPath();
                ctx.arc(cx, cy, labelRadius, 0, Math.PI * 2);
                ctx.fillStyle = (track && track.labelColor) || '#C85A32';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, cy, labelRadius - 14, 0, Math.PI * 2);
                ctx.strokeStyle = (track && track.accentColor) || '#F6F4F0';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, labelRadius - 24, Math.PI, Math.PI * 2);
                ctx.fillStyle = '#F6F4F0';
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = '#1E1B18';
                ctx.font = 'bold 24px "JetBrains Mono", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SPINDLE', cx, cy - 82);

                ctx.font = '16px "JetBrains Mono", monospace';
                ctx.fillText('STEREO 33⅓', cx, cy - 52);

                ctx.fillStyle = '#F6F4F0';
                ctx.font = 'bold 23px "Plus Jakarta Sans", sans-serif';
                const cleanTitle = ((track && track.title) || 'UNTITLED').substring(0, 18).toUpperCase();
                ctx.fillText(cleanTitle, cx, cy + 68);

                ctx.font = '17px "Plus Jakarta Sans", sans-serif';
                const cleanArtist = ((track && track.artist) || 'UNKNOWN ARTIST').substring(0, 22);
                ctx.fillText(cleanArtist, cx, cy + 96);

                ctx.beginPath();
                ctx.arc(cx, cy, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#1E1B18';
                ctx.fill();

                const texture = new THREE.CanvasTexture(canvas);
                texture.anisotropy = 4;
                return texture;
            }

            toggleDustCover() {

            updateRecordLabel(track) {
                if (!this.vinylMat || !track) return;
                const newTex = this.createVinylTexture(track);
                if (this.vinylMat.map) this.vinylMat.map.dispose();
                this.vinylMat.map = newTex;
                this.vinylMat.bumpMap = newTex;
                this.vinylMat.needsUpdate = true;
            }

            triggerTrackChange(track, autoPlay = true) {
                if (!track) return;
                if (this.mechState === 'IDLE_STOPPED') {
                    this.updateRecordLabel(track);
                    this.recordHeight = 2.0;
                    if (autoPlay) {
                        this.mechState = 'DROPPING_RECORD';
                    }
                } else {
                    this.pendingTrack = track;
                    this.pendingAutoPlay = autoPlay;
                    this.mechState = 'SWAPPING_OUT';
                }
            }

            // Smooth Spherical Arc Camera Transition with Smootherstep Easing
            setCameraView(preset) {
                let endPos, endLook;
                if (preset === 'iso') {
                    endPos = new THREE.Vector3(5.9, 5.1, 6.7);
                    endLook = new THREE.Vector3(0, 0.2, 0);
                } else if (preset === 'top') {
                    endPos = new THREE.Vector3(0.0, 8.6, 0.8);
                    endLook = new THREE.Vector3(-0.2, 0, 0);
                } else if (preset === 'side') {
                    endPos = new THREE.Vector3(3.6, 1.8, 3.8);
                    endLook = new THREE.Vector3(0.4, 0.35, 0.2);
                } else {
                    return;
                }

                const startLook = this.controls.target.clone();
                const startOffset = this.camera.position.clone().sub(startLook);
                const endOffset = endPos.clone().sub(endLook);

                const startSpherical = new THREE.Spherical().setFromVector3(startOffset);
                const endSpherical = new THREE.Spherical().setFromVector3(endOffset);

                // Shortest angular path around Y axis (theta)
                let deltaTheta = endSpherical.theta - startSpherical.theta;
                while (deltaTheta > Math.PI) deltaTheta -= Math.PI * 2;
                while (deltaTheta < -Math.PI) deltaTheta += Math.PI * 2;
                endSpherical.theta = startSpherical.theta + deltaTheta;

                this.camAnim = {
                    startSpherical,
                    endSpherical,
                    startLook,
                    endLook,
                    elapsed: 0,
                    duration: 1.65 // 1.65s cinematic orbital glide
                };

                // Sync the manual camera preset buttons in the top-right HUD
                document.querySelectorAll('.cam-btn').forEach(btn => {
                    if (btn.dataset.cam === preset) {
                        btn.className = 'cam-btn px-2.5 py-1 rounded-xl font-mono text-[11px] bg-terracotta text-alabaster transition';
                    } else {
                        btn.className = 'cam-btn px-2.5 py-1 rounded-xl font-mono text-[11px] text-espresso hover:bg-oatmeal transition';
                    }
                });
            }

            bindResize() {
                window.addEventListener('resize', () => {
                    if (!this.container) return;
                    const w = this.container.clientWidth;
                    const h = this.container.clientHeight;
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                });
            }

            update() {
                const dt = Math.min(this.clock.getDelta(), 0.1);
                const elapsed = this.clock.getElapsedTime();

                const progress = AppState.duration > 0
                    ? Math.min(1, Math.max(0, AppState.currentTime / AppState.duration))
                    : 0;

                const grooveYaw = 0.44 + progress * 0.34;

                switch (this.mechState) {
                    case 'IDLE_STOPPED':
                        this.targetRPM = 0;
                        this.armPitch += (0.0 - this.armPitch) * 8 * dt;
                        this.armYaw += (0.0 - this.armYaw) * 6 * dt;
                        this.recordHeight += (0.0 - this.recordHeight) * 7 * dt;
                        this.powerSwitchAngle += (-0.35 - this.powerSwitchAngle) * 8 * dt;
                        break;

                    case 'SWAPPING_OUT':
                        this.targetRPM = 0;
                        this.armPitch += (0.15 - this.armPitch) * 10 * dt;
                        this.armYaw += (0.0 - this.armYaw) * 7 * dt;
                        if (this.armYaw < 0.12) {
                            this.recordHeight += (2.2 - this.recordHeight) * 8 * dt;
                            if (this.recordHeight > 1.8) {
                                if (this.pendingTrack) {
                                    this.updateRecordLabel(this.pendingTrack);
                                }
                                this.mechState = this.pendingAutoPlay ? 'DROPPING_RECORD' : 'IDLE_STOPPED';
                            }
                        }
                        break;

                    case 'DROPPING_RECORD':
                        this.targetRPM = 0;
                        this.recordHeight += (0.0 - this.recordHeight) * 8 * dt;
                        this.armPitch += (0.15 - this.armPitch) * 8 * dt;
                        if (this.recordHeight < 0.03) {
                            this.recordHeight = 0;
                            this.mechState = 'CUIING_ARM';
                        }
                        break;

                    case 'CUIING_ARM':
                        this.targetRPM = AppState.rpmMode;
                        this.powerSwitchAngle += (0.35 - this.powerSwitchAngle) * 8 * dt;
                        this.armPitch += (0.15 - this.armPitch) * 9 * dt;
                        this.armYaw += (grooveYaw - this.armYaw) * 6 * dt;

                        if (Math.abs(this.armYaw - grooveYaw) < 0.015) {
                            this.armPitch += (0.02 - this.armPitch) * 6 * dt;
                            if (this.armPitch < 0.035) {
                                this.mechState = 'PLAYING';
                            }
                        }
                        break;

                    case 'PLAYING':
                        this.targetRPM = AppState.rpmMode;
                        this.powerSwitchAngle += (0.35 - this.powerSwitchAngle) * 8 * dt;
                        this.recordHeight += (0.0 - this.recordHeight) * 10 * dt;
                        const microFlutter = Math.sin(elapsed * 28) * 0.0012;
                        this.armPitch += ((0.018 + microFlutter) - this.armPitch) * 10 * dt;
                        this.armYaw += (grooveYaw - this.armYaw) * 5 * dt;
                        break;

                    case 'PAUSED':
                        this.targetRPM = 0;
                        this.armPitch += (0.11 - this.armPitch) * 8 * dt;
                        this.armYaw += (grooveYaw - this.armYaw) * 5 * dt;
                        break;

                    case 'RETURNING_ARM':
                        this.targetRPM = 0;
                        this.powerSwitchAngle += (-0.35 - this.powerSwitchAngle) * 8 * dt;
                        this.armPitch += (0.15 - this.armPitch) * 10 * dt;
                        if (this.armPitch > 0.10) {
                            this.armYaw += (0.0 - this.armYaw) * 6 * dt;
                            if (this.armYaw < 0.02) {
                                this.mechState = 'IDLE_STOPPED';
                            }
                        }
                        break;
                }

                this.currentRPM += (this.targetRPM - this.currentRPM) * 3.5 * dt;
                if (this.currentRPM < 0.05 && this.targetRPM === 0) this.currentRPM = 0;

                const radPerSec = (this.currentRPM / 60) * Math.PI * 2;
                this.platterGroup.rotation.y -= radPerSec * dt;
                this.recordMesh.rotation.z = Math.sin(this.platterGroup.rotation.y) * 0.004;

                this.recordGroup.position.y = 0.105 + this.recordHeight;
                this.tonearmYawGroup.rotation.y = -this.armYaw;
                this.tonearmPitchGroup.rotation.x = -this.armPitch;
                this.powerLever.rotation.y = this.powerSwitchAngle;

                if (this.cueLever) {
                    this.cueLever.rotation.x = -this.armPitch * 2.4;
                }

                const forceOpen = this.recordHeight > 0.15;
                const targetCoverAngle = (this.dustCoverOpen || forceOpen) ? 1.02 : 0.0;
                this.dustCoverAngle += (targetCoverAngle - this.dustCoverAngle) * 5 * dt;
                if (this.dustCoverGroup) {
                    this.dustCoverGroup.rotation.x = -this.dustCoverAngle;
                }

                const strobeActive = this.currentRPM > 1.0 || this.mechState !== 'IDLE_STOPPED';
                this.strobeLight.intensity = strobeActive ? 0.9 + Math.sin(elapsed * 60) * 0.1 : 0.15;
                this.strobeLens.material.color.setHex(strobeActive ? 0xFF5500 : 0x4A2511);

                this.targetLight.intensity = strobeActive ? 0.65 : 0.0;
                this.targetBulb.material.color.setHex(strobeActive ? 0xFFE0A3 : 0x4A3A28);

                // Execute smooth spherical camera transition with quintic smootherstep easing
                if (this.camAnim) {
                    this.camAnim.elapsed += dt;
                    const rawT = Math.min(1, this.camAnim.elapsed / this.camAnim.duration);
                    // Quintic smootherstep: zero 1st and 2nd derivatives at start & end
                    const ease = rawT * rawT * rawT * (rawT * (rawT * 6 - 15) + 10);

                    this.controls.target.lerpVectors(this.camAnim.startLook, this.camAnim.endLook, ease);

                    const currentSpherical = new THREE.Spherical(
                        THREE.MathUtils.lerp(this.camAnim.startSpherical.radius, this.camAnim.endSpherical.radius, ease),
                        THREE.MathUtils.lerp(this.camAnim.startSpherical.phi, this.camAnim.endSpherical.phi, ease),
                        THREE.MathUtils.lerp(this.camAnim.startSpherical.theta, this.camAnim.endSpherical.theta, ease)
                    );

                    const offsetVec = new THREE.Vector3().setFromSpherical(currentSpherical);
                    this.camera.position.copy(this.controls.target).add(offsetVec);
                    this.camera.lookAt(this.controls.target);

                    if (rawT >= 1) {
                        this.camAnim = null;
                        this.controls.update();
                    }
                } else {
                    this.controls.update();
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        let turntable3D = null;

        /***********************************************************************
         * 6. UI CONTROLLER: TOP PLAYLIST HERO, MIDDLE LIST & BOTTOM PLAYER
         ***********************************************************************/
        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '00:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function formatTotalDuration(trackIds) {
            let total = 0;
            trackIds.forEach(id => {
                const t = AppState.tracksById[id];
                if (t && t.duration) total += t.duration;
            });
            return formatTime(total);
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

            if (!AppState.hasActiveSession || !track) {
                nowPlayingSection.classList.add('hidden');

                stateBadge.textContent = 'Stopped';
                stateBadge.className = 'font-mono text-[11px] px-2.5 py-0.5 rounded-full bg-oatmeal text-muted border border-stone uppercase tracking-wider';
                statusLed.className = 'w-2.5 h-2.5 rounded-full bg-stone shadow-sm';
                return;
            }

            nowPlayingSection.classList.remove('hidden');
            nowPlayingSection.classList.add('flex');

            const playingPl = getPlayingPlaylist();
            document.getElementById('NowPlaying-playlist-name').textContent = playingPl ? playingPl.name : 'Playlist';
            document.getElementById('current-title').textContent = track.title;
            document.getElementById('current-artist').textContent = track.artist;

            const coverDisc = document.getElementById('cover-disc');
            coverDisc.style.background = `radial-gradient(circle, ${track.labelColor} 0%, ${track.labelColor} 28%, #141413 30%, #242424 46%, #111 48%, #292929 65%, #111 70%, #1c1c1c 100%)`;

            if (AppState.playbackState === 'PLAYING') {
                coverDisc.classList.add('playing');
            } else {
                coverDisc.classList.remove('playing');
            }

            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');

            if (AppState.playbackState === 'PLAYING') {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                stateBadge.textContent = 'Playing';
                stateBadge.className = 'font-mono text-[11px] px-2.5 py-0.5 rounded-full bg-terracotta/15 text-terracotta border border-terracotta/30 uppercase tracking-wider';
                statusLed.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm animate-pulse';
            } else if (AppState.playbackState === 'PAUSED') {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                stateBadge.textContent = 'Paused';
                stateBadge.className = 'font-mono text-[11px] px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-600 border border-amber-500/30 uppercase tracking-wider';

                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');

                stateBadge.className = 'font-mono text-[11px] px-2.5 py-0.5 rounded-full bg-oatmeal text-muted border border-stone uppercase tracking-wider';

        function openPlaylist(playlistId) {
            AppState.viewedPlaylistId = playlistId;
            AppState.uiView = 'PLAYLIST_DETAIL';
            AppState.isReorderMode = false;
            renderSidebarView();

            if (turntable3D) {
                turntable3D.setCameraView(AppState.hasActiveSession ? 'top' : 'side');
            }
        }

        function renderOpenedPlaylistTracks(pl) {
            const container = document.getElementById('playlist-container');
            container.innerHTML = '';

            if (pl.trackIds.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 px-4">
                        <p class="text-sm font-medium text-espresso">No songs in this playlist</p>
                        <p class="text-xs text-muted mt-1">Click "Add Songs" above or drag audio files here.</p>
                    </div>
                `;
                return;
            }

            pl.trackIds.forEach((trackId, idx) => {
                const track = AppState.tracksById[trackId];
                if (!track) return;

                const isSelected = AppState.hasActiveSession && (pl.id === AppState.playingPlaylistId && idx === AppState.currentIndex);
                const isPlaying = isSelected && AppState.playbackState === 'PLAYING';

                const row = document.createElement('div');
                row.dataset.index = idx;
                row.draggable = AppState.isReorderMode;
                row.className = `group flex items-center justify-between px-3.5 py-2.5 rounded-2xl cursor-pointer transition-all border ${
                    AppState.isReorderMode
                        ? 'bg-alabaster/90 border-stone border-dashed cursor-move hover:border-terracotta'
                        : isSelected
                            ? 'bg-alabaster border-stone shadow-sm'
                            : 'bg-transparent border-transparent hover:bg-alabaster/60 hover:border-stone/40'
                }`;

                row.innerHTML = `
                    <div class="flex items-center gap-3.5 min-w-0 flex-1">
                        ${
                            AppState.isReorderMode
                                ? `<div class="text-muted hover:text-espresso cursor-grab active:cursor-grabbing" title="Drag to reorder">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                        <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
                                        <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
                                        <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
                                    </svg>
                                   </div>`
                                : ''
                        }

                            ${
                                isPlaying
                                    ? `<div class="flex items-end gap-0.5 h-3.5">
                                        <span class="w-0.5 bg-alabaster eq-bar-1"></span>
                                        <span class="w-0.5 bg-alabaster eq-bar-2"></span>
                                        <span class="w-0.5 bg-alabaster eq-bar-3"></span>
                                       </div>`
                                    : `<div class="w-1.5 h-1.5 rounded-full bg-alabaster"></div>`
                            }
                        </div>

                        <div class="flex flex-col min-w-0 flex-1">
                            <span class="text-sm font-medium ${isSelected ? 'text-terracotta font-semibold' : 'text-espresso'} truncate">

                    <div class="flex items-center gap-2 shrink-0 ml-2">

                            AppState.isReorderMode
